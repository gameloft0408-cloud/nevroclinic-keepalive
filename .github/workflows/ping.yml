name: Keep NEVROCLINIC demo awake

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (GitHub may delay runs by a few minutes at busy times)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping site and CRM
        run: |
          for path in /api/health /ky /admin/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://nevroclinic.vercel.app$path")
            echo "$path -> $code"
          done
